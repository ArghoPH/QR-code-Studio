<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image QR Studio By Argho</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Sora:wght@600;700&display=swap"
    rel="stylesheet">
  <style>
    /* Layout idea: controls column on the left, sticky live preview on the right; stacks on phones. */
    :root {
      --bg: #f3f1ee;
      --panel: #ffffff;
      --ink: #1d1a1a;
      --muted: #6c6462;
      --line: #e2dcd8;
      --accent: #c8321f;
      --accent-ink: #ffffff;
      --field: #faf8f6;
      --ok: #1f7a4d;
      --warn: #a36200;
      --bad: #b3261e;
      --display: "Sora", "Hind Siliguri", system-ui, sans-serif;
      --body: "Hind Siliguri", system-ui, -apple-system, "Segoe UI", sans-serif;
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #161414;
        --panel: #211e1e;
        --ink: #f1ecea;
        --muted: #a69d9a;
        --line: #383231;
        --accent: #ff6a55;
        --accent-ink: #1b0f0d;
        --field: #1a1717;
        --ok: #5fd39a;
        --warn: #f0b451;
        --bad: #ff8a80;
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --bg: #161414;
      --panel: #211e1e;
      --ink: #f1ecea;
      --muted: #a69d9a;
      --line: #383231;
      --accent: #ff6a55;
      --accent-ink: #1b0f0d;
      --field: #1a1717;
      --ok: #5fd39a;
      --warn: #f0b451;
      --bad: #ff8a80;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font: 400 16px/1.5 var(--body)
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px 16px 48px;
      display: flex;
      flex-direction: column;
      gap: 20px
    }

    header h1 {
      font: 700 26px/1.2 var(--display);
      margin: 0;
      text-wrap: balance
    }

    header p {
      margin: 4px 0 0;
      color: var(--muted);
      max-width: 60ch
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 420px);
      gap: 20px;
      align-items: start
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0
    }

    .card h2 {
      font: 600 15px/1.2 var(--display);
      margin: 0;
      letter-spacing: .01em
    }

    .preview {
      position: sticky;
      top: 16px
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px
    }

    .chip {
      font: 500 14px/1 var(--body);
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--field);
      color: var(--ink);
      cursor: pointer
    }

    .chip[aria-pressed="true"] {
      background: var(--ink);
      color: var(--panel);
      border-color: var(--ink)
    }

    .fields {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px
    }

    .fields .wide {
      grid-column: 1/-1
    }

    label.f {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 13px;
      color: var(--muted);
      min-width: 0
    }

    input[type=text],
    input[type=url],
    input[type=tel],
    input[type=email],
    textarea,
    select {
      font: 400 16px/1.4 var(--body);
      color: var(--ink);
      background: var(--field);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 10px;
      width: 100%;
      min-width: 0
    }

    textarea {
      min-height: 84px;
      resize: vertical
    }

    input[type=range] {
      width: 100%;
      accent-color: var(--accent)
    }

    input[type=color] {
      width: 44px;
      height: 32px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--field);
      cursor: pointer
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center
    }

    .row>label.f {
      flex: 1 1 180px
    }

    .check {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      font-size: 14px;
      color: var(--ink);
      cursor: pointer
    }

    .check input {
      margin-top: 4px;
      accent-color: var(--accent)
    }

    .check small {
      display: block;
      color: var(--muted)
    }

    .drop {
      border: 1.5px dashed var(--line);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      background: var(--field)
    }

    .drop.over {
      border-color: var(--accent)
    }

    .drop img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 0 0/12px 12px;
      flex: none
    }

    .drop .txt {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      color: var(--muted)
    }

    .drop .txt b {
      color: var(--ink);
      font-weight: 600;
      display: block;
      overflow-wrap: anywhere
    }

    .btn {
      font: 600 15px/1 var(--body);
      padding: 11px 16px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--field);
      color: var(--ink);
      cursor: pointer
    }

    .btn.primary {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent)
    }

    .btn.small {
      padding: 8px 10px;
      font-size: 13px
    }

    .btn[hidden] {
      display: none
    }

    .swatches {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px
    }

    .sw {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted)
    }

    .qrbox {
      background: repeating-conic-gradient(color-mix(in srgb, var(--line) 60%, transparent) 0 25%, transparent 0 50%) 0 0/16px 16px;
      border-radius: 10px;
      padding: 14px;
      display: flex;
      justify-content: center
    }

    .qrbox img {
      width: 100%;
      max-width: 360px;
      height: auto;
      aspect-ratio: 1;
      display: block
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font: 600 14px/1.2 var(--body);
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid currentColor
    }

    .pill::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: currentColor;
      flex: none
    }

    .pill.ok {
      color: var(--ok)
    }

    .pill.warn {
      color: var(--warn)
    }

    .pill.bad {
      color: var(--bad)
    }

    .hint {
      font-size: 13px;
      color: var(--muted);
      margin: 0
    }

    .payload {
      font: 400 12px/1.45 ui-monospace, Menlo, Consolas, monospace;
      background: var(--field);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      max-height: 96px;
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin: 0
    }

    .val {
      font-variant-numeric: tabular-nums;
      color: var(--ink)
    }

    @media (max-width:820px) {
      .grid {
        grid-template-columns: 1fr
      }

      .preview {
        position: static;
        order: -1
      }

      .qrbox img {
        max-width: 280px
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <h1>Image QR Studio By Argho</h1>
      <p>Upload a logo or picture. The QR code is drawn through it and takes its colors. Change the image or the content
        any time.</p>
    </header>

    <div class="grid">
      <div class="controls">
        <section class="card">
          <h2>What the QR opens</h2>
          <div class="chips" id="types" role="group" aria-label="QR type"></div>
          <div class="fields" id="fields"></div>
        </section>

        <section class="card">
          <h2>Image</h2>
          <div class="drop" id="drop">
            <img id="thumb" alt="Current image">
            <div class="txt"><b id="imgName">Example image</b><span id="imgNote">Drop, paste or choose your own logo or
                photo.</span></div>
            <button class="btn small" id="pick" type="button">Choose image</button>
            <button class="btn small" id="clearImg" type="button">Remove</button>
            <input type="file" id="file" accept="image/*" hidden>
          </div>
          <div class="row">
            <label class="f" for="imgScale">Image size <span class="val" id="imgScaleV"></span>
              <input type="range" id="imgScale" min="30" max="140" value="100"></label>
            <label class="f" for="imgShape">Image shape
              <select id="imgShape">
                <option value="square">Original</option>
                <option value="circle">Circle</option>
              </select></label>
          </div>
        </section>

        <section class="card">
          <h2>Dots</h2>
          <div class="row">
            <label class="f" for="dotSize">Dot size <span class="val" id="dotSizeV"></span>
              <input type="range" id="dotSize" min="30" max="100" value="50"></label>
            <label class="f" for="dotShape">Dot shape
              <select id="dotShape">
                <option value="square">Square</option>
                <option value="rounded">Rounded</option>
                <option value="circle">Circle</option>
              </select></label>
            <label class="f" for="eyeStyle">Corner eyes
              <select id="eyeStyle">
                <option value="square">Square</option>
                <option value="rounded">Rounded</option>
                <option value="circle">Circle</option>
              </select></label>
          </div>
          <label class="check" for="clean"><input type="checkbox" id="clean" checked>
            <span>Show more of the image<small>Leaves out dots where the image is already dark or light
                enough.</small></span></label>
          <label class="check" for="frame"><input type="checkbox" id="frame" checked>
            <span>Rounded frame</span></label>
        </section>

        <section class="card">
          <h2>Colors</h2>
          <label class="check" for="auto"><input type="checkbox" id="auto" checked>
            <span>Take colors from the image<small>Turns off when you pick a color yourself.</small></span></label>
          <div class="swatches">
            <label class="sw" for="cDark"><input type="color" id="cDark">Dark dots</label>
            <label class="sw" for="cLight"><input type="color" id="cLight">Light dots</label>
            <label class="sw" for="cBg"><input type="color" id="cBg">Background</label>
            <label class="sw" for="cEye"><input type="color" id="cEye">Corner eyes</label>
          </div>
        </section>
      </div>

      <aside class="card preview">
        <div class="qrbox"><img id="out" alt="Your QR code"></div>
        <div class="row"><span class="pill warn" id="status" role="status">Checking</span></div>
        <p class="hint" id="info"></p>
        <div class="row">
          <label class="f" for="size">PNG size
            <select id="size">
              <option value="1024">1024 px</option>
              <option value="2048" selected>2048 px</option>
              <option value="4096">4096 px (print)</option>
            </select></label>
          <button class="btn primary" id="dl" type="button">Download PNG</button>
        </div>
        <p class="hint" id="dlMsg" role="status"></p>
        <pre class="payload" id="payload" aria-label="Encoded content"></pre>
      </aside>
    </div>
  </div>

  <script src="/qrcode.js"></script>
  <script src="/jsQR.js"></script> 
  <script>
    (function () {
      "use strict";
      const $ = id => document.getElementById(id);
      qrcode.stringToBytes = s => Array.from(new TextEncoder().encode(s));

      /* ---------- content types ---------- */
      const enc = encodeURIComponent, digits = s => s.replace(/[^\d]/g, "");
      const wifiEsc = s => s.replace(/([\\;,":])/g, "\\$1");
      const TYPES = {
        url: {
          label: "Link", fields: [{ id: "url", label: "Web address", type: "url", ph: "https://your-site.com", val: "https://example.com", wide: 1 }],
          build: f => { const u = f.url.trim(); return !u ? "" : /^[a-z][a-z0-9+.-]*:/i.test(u) ? u : "https://" + u }
        },
        text: { label: "Text", fields: [{ id: "text", label: "Text", type: "area", ph: "Any text, any language", val: "", wide: 1 }], build: f => f.text },
        wifi: {
          label: "WiFi", fields: [{ id: "ssid", label: "Network name", val: "" }, { id: "pass", label: "Password", val: "" },
          { id: "enc", label: "Security", type: "select", opts: [["WPA", "WPA / WPA2 / WPA3"], ["WEP", "WEP"], ["nopass", "No password"]], val: "WPA" },
          { id: "hidden", label: "Hidden network", type: "select", opts: [["", "No"], ["true", "Yes"]], val: "" }],
          build: f => !f.ssid ? "" : "WIFI:T:" + f.enc + ";S:" + wifiEsc(f.ssid) + ";" + (f.enc !== "nopass" ? "P:" + wifiEsc(f.pass) + ";" : "") + (f.hidden ? "H:true;" : "") + ";"
        },
        contact: {
          label: "Contact", fields: [{ id: "name", label: "Full name", val: "" }, { id: "phone", label: "Phone", type: "tel", val: "" }, { id: "email", label: "Email", type: "email", val: "" },
          { id: "org", label: "Company", val: "" }, { id: "title", label: "Job title", val: "" }, { id: "web", label: "Website", val: "" }, { id: "addr", label: "Address", val: "", wide: 1 }],
          build: f => {
            if (!f.name && !f.phone && !f.email) return ""; const v = s => s.replace(/([\\;,])/g, "\\$1").replace(/\n/g, "\\n");
            const L = ["BEGIN:VCARD", "VERSION:3.0", "N:;" + v(f.name) + ";;;", "FN:" + v(f.name)];
            if (f.org) L.push("ORG:" + v(f.org)); if (f.title) L.push("TITLE:" + v(f.title)); if (f.phone) L.push("TEL;TYPE=CELL:" + f.phone.trim());
            if (f.email) L.push("EMAIL:" + f.email.trim()); if (f.web) L.push("URL:" + f.web.trim()); if (f.addr) L.push("ADR:;;" + v(f.addr) + ";;;;");
            L.push("END:VCARD"); return L.join("\n")
          }
        },
        whatsapp: {
          label: "WhatsApp", fields: [{ id: "num", label: "Number with country code", type: "tel", ph: "8801XXXXXXXXX", val: "" }, { id: "msg", label: "Ready-made message (optional)", val: "", wide: 1 }],
          build: f => !digits(f.num) ? "" : "https://wa.me/" + digits(f.num) + (f.msg ? "?text=" + enc(f.msg) : "")
        },
        phone: { label: "Call", fields: [{ id: "num", label: "Phone number", type: "tel", ph: "+8801XXXXXXXXX", val: "", wide: 1 }], build: f => !f.num.trim() ? "" : "tel:" + f.num.replace(/[^\d+]/g, "") },
        sms: {
          label: "SMS", fields: [{ id: "num", label: "Phone number", type: "tel", val: "" }, { id: "msg", label: "Message", val: "", wide: 1 }],
          build: f => !f.num.trim() ? "" : "SMSTO:" + f.num.replace(/[^\d+]/g, "") + ":" + f.msg
        },
        email: {
          label: "Email", fields: [{ id: "to", label: "To", type: "email", val: "" }, { id: "sub", label: "Subject", val: "" }, { id: "body", label: "Message", type: "area", val: "", wide: 1 }],
          build: f => { if (!f.to.trim()) return ""; const q = []; if (f.sub) q.push("subject=" + enc(f.sub)); if (f.body) q.push("body=" + enc(f.body)); return "mailto:" + f.to.trim() + (q.length ? "?" + q.join("&") : "") }
        },
        geo: {
          label: "Location", fields: [{ id: "lat", label: "Latitude", ph: "23.8103", val: "" }, { id: "lng", label: "Longitude", ph: "90.4125", val: "" }],
          build: f => { const a = parseFloat(f.lat), b = parseFloat(f.lng); return isFinite(a) && isFinite(b) ? "geo:" + a + "," + b : "" }
        }
      };
      const S = { type: "url", vals: {}, img: null, imgName: "", colors: { dark: "#111111", light: "#ffffff", bg: "#ffffff", eye: "#111111" } };
      for (const k in TYPES) { S.vals[k] = {}; TYPES[k].fields.forEach(f => S.vals[k][f.id] = f.val) }

      function buildTypes() {
        const box = $("types");
        for (const k in TYPES) {
          const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.id = "type-" + k; b.textContent = TYPES[k].label;
          b.setAttribute("aria-pressed", k === S.type); b.onclick = () => { S.type = k;[...box.children].forEach(c => c.setAttribute("aria-pressed", c === b)); buildFields(); schedule() }; box.appendChild(b)
        }
      }
      function buildFields() {
        const box = $("fields"); box.textContent = "";
        TYPES[S.type].fields.forEach(f => {
          const l = document.createElement("label"); l.className = "f" + (f.wide ? " wide" : ""); const id = "f-" + S.type + "-" + f.id; l.htmlFor = id; l.append(f.label);
          let el;
          if (f.type === "area") { el = document.createElement("textarea") }
          else if (f.type === "select") { el = document.createElement("select"); f.opts.forEach(o => { const op = document.createElement("option"); op.value = o[0]; op.textContent = o[1]; el.appendChild(op) }) }
          else { el = document.createElement("input"); el.type = f.type || "text" }
          el.id = id; if (f.ph) el.placeholder = f.ph; el.value = S.vals[S.type][f.id]; el.autocomplete = "off";
          el.addEventListener("input", () => { S.vals[S.type][f.id] = el.value; schedule() });
          l.appendChild(el); box.appendChild(l)
        });
      }

      /* ---------- color helpers ---------- */
      const lum = (r, g, b) => 0.299 * r + 0.587 * g + 0.114 * b;
      const hex = (r, g, b) => "#" + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join("");
      const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
      function toLum(c, target) { const l = lum(c[0], c[1], c[2]); if (l <= target) return c; const k = target / l; return c.map(v => v * k) }

      function autoTheme(src) {
        const n = 72, c = document.createElement("canvas"); c.width = c.height = n; const x = c.getContext("2d", { willReadFrequently: true });
        x.drawImage(src, 0, 0, n, n); const d = x.getImageData(0, 0, n, n).data;
        const bins = new Map(), edge = new Map(); let opaque = 0, edgeOpaque = 0, edgeN = 0, sumL = 0;
        const add = (m, r, g, b) => { const k = (r >> 4) << 8 | (g >> 4) << 4 | (b >> 4); let e = m.get(k); if (!e) { e = [0, 0, 0, 0]; m.set(k, e) } e[0] += r; e[1] += g; e[2] += b; e[3]++ };
        for (let y = 0; y < n; y++)for (let i = 0; i < n; i++) {
          const p = (y * n + i) * 4, a = d[p + 3], isEdge = y < 2 || i < 2 || y >= n - 2 || i >= n - 2;
          if (isEdge) { edgeN++; if (a >= 240) { edgeOpaque++; add(edge, d[p], d[p + 1], d[p + 2]) } }
          if (a > 128) { opaque++; sumL += lum(d[p], d[p + 1], d[p + 2]); add(bins, d[p], d[p + 1], d[p + 2]) }
        }
        const top = m => { let best = null; m.forEach(e => { if (!best || e[3] > best[3]) best = e }); return best ? [best[0] / best[3], best[1] / best[3], best[2] / best[3]] : null };
        let bg;
        if (edgeOpaque / edgeN > 0.8) bg = top(edge);
        else bg = opaque && sumL / opaque > 205 ? [17, 17, 17] : [255, 255, 255];
        const bgL = lum(bg[0], bg[1], bg[2]);
        let dark;
        if (bgL < 125) dark = toLum(bg, 100);
        else {
          let best = null, bs = 0, sat = null, ss = 0;
          bins.forEach(e => {
            const share = e[3] / opaque; if (share < 0.012) return; const c = [e[0] / e[3], e[1] / e[3], e[2] / e[3]], l = lum(c[0], c[1], c[2]);
            const s = (Math.max(c[0], c[1], c[2]) - Math.min(c[0], c[1], c[2])) / 255;
            if (l < 120) { const sc = share * (0.35 + s); if (sc > bs) { bs = sc; best = c } }
            if (l < 215 && s > 0.25) { const sc = share * s; if (sc > ss) { ss = sc; sat = c } }
          });
          dark = best || (sat ? toLum(sat, 85) : [20, 20, 20]); dark = toLum(dark, 105)
        }
        const light = bgL >= 215 ? bg : [255, 255, 255];
        return { dark: hex(...dark), light: hex(...light), bg: hex(...bg), eye: hex(...dark) };
      }

      /* ---------- QR drawing ---------- */
      function alignCenters(ver) {
        if (ver < 2) return []; const n = Math.floor(ver / 7) + 2, step = ver === 32 ? 26 : Math.ceil((ver * 4 + 4) / (n * 2 - 2)) * 2, res = [6];
        for (let p = ver * 4 + 10; res.length < n; p -= step)res.splice(1, 0, p); return res
      }
      function rr(x, X, Y, W, H, R) { R = Math.min(R, W / 2, H / 2); x.moveTo(X + R, Y); x.arcTo(X + W, Y, X + W, Y + H, R); x.arcTo(X + W, Y + H, X, Y + H, R); x.arcTo(X, Y + H, X, Y, R); x.arcTo(X, Y, X + W, Y, R); x.closePath() }
      function blob(x, style, X, Y, W, color, k) { x.beginPath(); if (style === "circle") x.arc(X + W / 2, Y + W / 2, W / 2, 0, 7); else rr(x, X, Y, W, W, style === "rounded" ? W * k : 0); x.fillStyle = color; x.fill() }

      function makeQR(text) {
        let last = null;
        // fewer, bigger dots scan better than extra error correction on long content
        for (const lv of ["H", "Q", "M"]) { const q = qrcode(0, lv); q.addData(text, "Byte"); q.make(); q.level = lv; last = q; if (q.getModuleCount() <= 45) return q }
        return last
      }

      function render(q, size, o) {
        const N = q.getModuleCount(), M = 2, T = N + 2 * M, cell = size / T;
        const cv = document.createElement("canvas"); cv.width = cv.height = size; const x = cv.getContext("2d");
        x.fillStyle = o.bg; x.fillRect(0, 0, size, size);
        if (o.img) {
          const area = N * cell * o.imgScale, iw = o.img.width, ih = o.img.height, k = Math.min(area / iw, area / ih), w = iw * k, h = ih * k;
          x.save(); x.beginPath();
          if (o.imgShape === "circle") x.arc(size / 2, size / 2, Math.min(w, h) / 2, 0, 7); else x.rect(0, 0, size, size);
          x.clip(); x.imageSmoothingQuality = "high"; x.drawImage(o.img, (size - w) / 2, (size - h) / 2, w, h); x.restore()
        }
        // brightness of the picture under each module centre
        const sn = T * 4, sc = document.createElement("canvas"); sc.width = sc.height = sn; const sx = sc.getContext("2d", { willReadFrequently: true });
        sx.imageSmoothingQuality = "high"; sx.drawImage(cv, 0, 0, sn, sn); const sd = sx.getImageData(0, 0, sn, sn).data;
        const L = (c, r) => { let t = 0; for (let j = 1; j < 3; j++)for (let i = 1; i < 3; i++) { const p = (((r + M) * 4 + j) * sn + (c + M) * 4 + i) * 4; t += lum(sd[p], sd[p + 1], sd[p + 2]) } return t / 4 };
        const dk = rgb(o.dark), lt = rgb(o.light), dL = lum(...dk), lL = lum(...lt);
        const skipD = Math.min(125, Math.max(95, dL + 12)), skipL = Math.max(160, Math.min(185, lL - 12));
        const ac = alignCenters((N - 17) / 4), aligns = [];
        ac.forEach(a => ac.forEach(b => { if ((a < 9 && b < 9) || (a < 9 && b > N - 10) || (a > N - 10 && b < 9)) return; aligns.push([a, b]) }));
        const reserved = (c, r) => {
          if ((c < 8 && r < 8) || (c >= N - 8 && r < 8) || (c < 8 && r >= N - 8)) return true;
          for (const a of aligns) if (Math.abs(c - a[0]) <= 2 && Math.abs(r - a[1]) <= 2) return true; return false
        };
        x.save(); x.setTransform(cell, 0, 0, cell, M * cell, M * cell);
        const d = o.dot, off = (1 - d) / 2;
        [true, false].forEach(isD => {
          x.beginPath();
          for (let r = 0; r < N; r++)for (let c = 0; c < N; c++) {
            if (q.isDark(r, c) !== isD || reserved(c, r)) continue;
            if (o.clean) { const l = L(c, r); if (isD ? l <= skipD : l >= skipL) continue }
            if (o.dotShape === "circle") { x.moveTo(c + 0.5 + d / 2, r + 0.5); x.arc(c + 0.5, r + 0.5, d / 2, 0, 7) }
            else if (o.dotShape === "rounded") rr(x, c + off, r + off, d, d, d * 0.3); else x.rect(c + off, r + off, d, d)
          }
          x.fillStyle = isD ? o.dark : o.light; x.fill()
        });
        const eyeC = lum(...rgb(o.eye)) > 125 ? hex(...toLum(rgb(o.eye), 105)) : o.eye;
        [[0, 0], [N - 7, 0], [0, N - 7]].forEach(e => {
          blob(x, o.eye_style === "circle" ? "circle" : o.eye_style, e[0] - 1, e[1] - 1, 9, o.light, 0.2);
          blob(x, o.eye_style, e[0], e[1], 7, eyeC, 0.24); blob(x, o.eye_style, e[0] + 1, e[1] + 1, 5, o.light, 0.2); blob(x, o.eye_style, e[0] + 2, e[1] + 2, 3, eyeC, 0.26)
        });
        const as = o.eye_style === "circle" ? "circle" : o.eye_style;
        aligns.forEach(a => { blob(x, as, a[0] - 2.5, a[1] - 2.5, 6, o.light, 0.2); blob(x, as, a[0] - 2, a[1] - 2, 5, eyeC, 0.2); blob(x, as, a[0] - 1, a[1] - 1, 3, o.light, 0.2); blob(x, as, a[0], a[1], 1, eyeC, 0.2) });
        x.restore();
        if (!o.frame) return cv;
        const out = document.createElement("canvas"); out.width = out.height = size; const y = out.getContext("2d"), lw = size * 0.012, R = size * 0.06;
        y.save(); y.beginPath(); rr(y, 0, 0, size, size, R); y.clip(); y.drawImage(cv, 0, 0); y.restore();
        y.beginPath(); rr(y, lw / 2, lw / 2, size - lw, size - lw, R - lw / 2); y.lineWidth = lw; y.strokeStyle = eyeC; y.stroke();
        return out;
      }

      /* ---------- scan test ---------- */
      function scans(cv, px) {
        const c = document.createElement("canvas"), pad = Math.round(px * 0.06); c.width = c.height = px + pad * 2; const x = c.getContext("2d", { willReadFrequently: true });
        x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.imageSmoothingQuality = "high"; x.drawImage(cv, pad, pad, px, px);
        const d = x.getImageData(0, 0, c.width, c.height); try { return !!jsQR(d.data, c.width, c.height, { inversionAttempts: "dontInvert" }) } catch (e) { return false }
      }

      /* ---------- state → UI ---------- */
      function opts() {
        return {
          img: S.img, imgScale: +$("imgScale").value / 100, imgShape: $("imgShape").value, dot: +$("dotSize").value / 100, dotShape: $("dotShape").value,
          eye_style: $("eyeStyle").value, clean: $("clean").checked, frame: $("frame").checked, dark: S.colors.dark, light: S.colors.light, bg: S.colors.bg, eye: S.colors.eye
        }
      }
      function setStatus(cls, msg) { const s = $("status"); s.className = "pill " + cls; s.textContent = msg }
      let timer = 0, lastUrl = "", current = null;
      function schedule() { clearTimeout(timer); timer = setTimeout(update, 60) }
      function update() {
        $("imgScaleV").textContent = $("imgScale").value + "%"; $("dotSizeV").textContent = $("dotSize").value + "%";
        const text = TYPES[S.type].build(S.vals[S.type]); $("payload").textContent = text || "(nothing yet)";
        if (!text) { current = null; setStatus("warn", "Fill in the fields above"); $("info").textContent = ""; return }
        let q; try { q = makeQR(text) } catch (e) { current = null; setStatus("bad", "Too much content for one QR code. Shorten it."); $("info").textContent = ""; return }
        current = { q, text }; const cv = render(q, 900, opts());
        cv.toBlob(b => { if (!b) return; const u = URL.createObjectURL(b); $("out").src = u; if (lastUrl) URL.revokeObjectURL(lastUrl); lastUrl = u }, "image/png");
        const N = q.getModuleCount();
        $("info").textContent = N + " × " + N + " modules, error correction " + ({ H: "high", Q: "medium-high", M: "medium" })[q.level] + "." + (N > 57 ? " Long content makes the dots small. A shorter link shows more of the image." : "");
        const big = scans(cv, 720), small = scans(cv, 300);
        const dL = lum(...rgb(S.colors.dark)), lL = lum(...rgb(S.colors.light));
        if (big && small) setStatus("ok", "Scan test passed");
        else if (big) setStatus("warn", "Scans large, fails small. Make the dots bigger.");
        else setStatus("bad", dL > 130 || lL - dL < 90 ? "Not readable. Dark and light colors are too close." : "Not readable. Make the dots bigger.");
      }
      function showColors() { $("cDark").value = S.colors.dark; $("cLight").value = S.colors.light; $("cBg").value = S.colors.bg; $("cEye").value = S.colors.eye }
      function applyAuto() { if (!$("auto").checked) return; S.colors = S.img ? autoTheme(S.img) : { dark: "#111111", light: "#ffffff", bg: "#ffffff", eye: "#111111" }; showColors() }
      function setImage(cv, name) {
        S.img = cv; S.imgName = name;
        $("thumb").src = cv ? cv.toDataURL("image/png") : "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E";
        $("imgName").textContent = cv ? name : "No image"; $("imgNote").textContent = cv ? "Drop, paste or choose another image to replace it." : "Plain QR. Drop, paste or choose a logo or photo.";
        $("clearImg").hidden = !cv; applyAuto(); schedule()
      }
      function loadFile(file) {
        if (!file || !/^image\//.test(file.type)) return; const url = URL.createObjectURL(file), im = new Image();
        im.onload = () => {
          const k = Math.min(1, 1400 / Math.max(im.naturalWidth, im.naturalHeight) || 1), c = document.createElement("canvas");
          c.width = Math.max(1, Math.round((im.naturalWidth || 512) * k)); c.height = Math.max(1, Math.round((im.naturalHeight || 512) * k));
          c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url); $("auto").checked = true; setImage(c, file.name || "Pasted image")
        };
        im.onerror = () => { URL.revokeObjectURL(url); $("imgNote").textContent = "That file could not be read as an image. Try a PNG or JPG." }; im.src = url
      }
      function exampleImage() {
        const c = document.createElement("canvas"); c.width = c.height = 600; const x = c.getContext("2d");
        x.fillStyle = "#d3261c"; x.fillRect(0, 0, 600, 600); x.fillStyle = "#ffc928"; x.beginPath(); x.arc(395, 215, 95, 0, 7); x.fill();
        x.fillStyle = "#ffffff"; x.beginPath(); x.moveTo(90, 460); x.lineTo(250, 200); x.lineTo(330, 330); x.lineTo(390, 270); x.lineTo(510, 460); x.closePath(); x.fill();
        x.fillStyle = "#8f140e"; x.beginPath(); x.moveTo(250, 200); x.lineTo(330, 330); x.lineTo(290, 460); x.lineTo(210, 460); x.closePath(); x.fill(); return c
      }

      /* ---------- wiring ---------- */
      buildTypes(); buildFields();
      ["imgScale", "imgShape", "dotSize", "dotShape", "eyeStyle", "clean", "frame"].forEach(id => $(id).addEventListener("input", schedule));
      [["cDark", "dark"], ["cLight", "light"], ["cBg", "bg"], ["cEye", "eye"]].forEach(p => $(p[0]).addEventListener("input", e => { S.colors[p[1]] = e.target.value; if (p[1] === "dark" && $("auto").checked) S.colors.eye = e.target.value; $("auto").checked = false; showColors(); schedule() }));
      $("auto").addEventListener("change", () => { applyAuto(); schedule() });
      $("pick").onclick = () => $("file").click();
      $("file").addEventListener("change", e => { loadFile(e.target.files[0]); e.target.value = "" });
      $("clearImg").onclick = () => setImage(null, "");
      const drop = $("drop");
      ["dragenter", "dragover"].forEach(t => document.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over") }));
      ["dragleave", "drop"].forEach(t => document.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over") }));
      document.addEventListener("drop", e => { const f = e.dataTransfer && e.dataTransfer.files[0]; loadFile(f) });
      document.addEventListener("paste", e => { const it = [...(e.clipboardData ? e.clipboardData.items : [])].find(i => i.type.startsWith("image/")); if (it) { e.preventDefault(); loadFile(it.getAsFile()) } });

      let saverP = null;
      function getSaver() {
        if (!(window.claude && typeof window.claude.use === "function")) return Promise.resolve(null);
        if (!saverP) saverP = window.claude.use("downloads").catch(() => null); return saverP
      }
      getSaver();
      const manual = "If no file was saved: right-click the QR above and choose Save image, or long-press it on a phone. It is now at full size.";
      $("dl").onclick = () => {
        if (!current) { $("dlMsg").textContent = "Fill in the fields first."; return }
        const name = "qr-" + S.type + ".png", cv = render(current.q, +$("size").value, opts()); $("dlMsg").textContent = "Preparing…";
        cv.toBlob(b => {
          if (!b) { $("dlMsg").textContent = "Could not build the PNG. Try a smaller size."; return }
          const u = URL.createObjectURL(b); $("out").src = u; if (lastUrl) URL.revokeObjectURL(lastUrl); lastUrl = u;
          const fallback = () => { try { const a = document.createElement("a"); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove() } catch (e) { } $("dlMsg").textContent = manual };
          Promise.race([getSaver(), new Promise(r => setTimeout(() => r(null), 4000))]).then(d => {
            if (!d) { fallback(); return }
            d.save({ filename: name, data: b }).then(() => { $("dlMsg").textContent = "Saved." })
              .catch(err => { const c = err && err.code; if (c === "declined") $("dlMsg").textContent = ""; else if (c === "rate_limited") $("dlMsg").textContent = "A save is already open. Try again in a moment."; else fallback() })
          })
        }, "image/png")
      };

      window.__qr = { S, update, setImage, render, opts, scans, makeQR, TYPES };
      showColors(); setImage(exampleImage(), "Example image");
    })();
  </script>
